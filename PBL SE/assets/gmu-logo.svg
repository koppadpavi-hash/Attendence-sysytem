<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEAB3"/>
      <stop offset="40%" stop-color="#E5BA55"/>
      <stop offset="100%" stop-color="#C29432"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Emblem: Stylized Banyan Tree, Book, Flame & Trishul -->
  <g transform="translate(15, 6)" filter="url(#glow)">
    <!-- Banyan Tree Branches & Knowledge Flame in Gold -->
    <path d="M 45 42 C 30 35, 20 22, 28 12 C 34 22, 42 26, 45 32 C 48 26, 56 22, 62 12 C 70 22, 60 35, 45 42 Z" fill="url(#goldGradient)"/>
    <path d="M 45 32 C 38 24, 30 18, 36 6 C 42 16, 44 20, 45 24 C 46 20, 48 16, 54 6 C 60 18, 52 24, 45 32 Z" fill="url(#goldGradient)" opacity="0.9"/>
    
    <!-- Central Knowledge Torch / Trishul Flame -->
    <path d="M 45 2 C 42 10, 41 16, 45 22 C 49 16, 48 10, 45 2 Z" fill="#FFF4D0"/>

    <!-- Open Book Base -->
    <path d="M 22 52 Q 45 44 45 56 Q 45 44 68 52 L 66 62 Q 45 54 45 66 Q 45 54 24 62 Z" fill="url(#goldGradient)"/>
    <path d="M 45 56 L 45 66" stroke="#3D0F16" stroke-width="1.8"/>

    <!-- Subtle Roots / Stand -->
    <path d="M 38 66 L 52 66 L 48 70 L 42 70 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Typography matching official gmu.ac.in branding -->
  <g transform="translate(100, 20)">
    <!-- "GM UNIVERSITY" in bold university gold serif -->
    <text x="0" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#goldGradient)" letter-spacing="1.5">
      GM UNIVERSITY
    </text>

    <!-- Tagline: "Innovating Minds" in gold script style -->
    <text x="2" y="60" font-family="'Brush Script MT', 'Segoe Script', 'Georgia', cursive, sans-serif" font-size="19" font-weight="400" fill="#FDF1D0" letter-spacing="1" font-style="italic">
      Innovating Minds
    </text>

    <!-- Accreditation & Location -->
    <text x="2" y="78" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="600" fill="#D8C28B" letter-spacing="1.2">
      DAVANAGERE, KARNATAKA • ESTD. 2023
    </text>
  </g>
</svg>
